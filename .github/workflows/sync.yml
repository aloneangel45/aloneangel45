name: Sync Profile Telemetry

on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    name: Refresh Profile SVGs & Metrics
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run zero-dependency Go telemetry sync
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: go run ./cmd/sync

      - name: Commit updated assets and README if changed
        run: |
          if [[ -n "$(git status --porcelain assets/ README.md)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets/ README.md
            git commit -m "chore(sync): refresh live profile metrics and SVGs [skip ci]"
            git push
          fi
