<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="1200" height="290" role="img" aria-label="Arda (@aloneangel45) — Systems, Reverse Engineering &amp; AI Agent Infrastructure">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181825"/>
      <stop offset="52%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <radialGradient id="glowMauve" cx="18%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#cba6f7" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#cba6f7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowBlue" cx="85%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#89b4fa" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#89b4fa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cdd6f4"/>
      <stop offset="55%" stop-color="#cba6f7"/>
      <stop offset="100%" stop-color="#89b4fa"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cba6f7" stop-opacity="0.55"/>
      <stop offset="50%" stop-color="#45475a" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#89b4fa" stop-opacity="0.55"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#313244" stroke-width="0.65" stroke-opacity="0.42"/>
    </pattern>
  </defs>

  <!-- Outer Card -->
  <rect x="2" y="2" width="1196" height="286" rx="18" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="1.5"/>
  <rect x="2" y="2" width="1196" height="286" rx="18" fill="url(#grid)"/>
  <rect x="2" y="2" width="1196" height="286" rx="18" fill="url(#glowMauve)"/>
  <rect x="2" y="2" width="1196" height="286" rx="18" fill="url(#glowBlue)"/>

  <!-- Top Terminal Bar -->
  <path d="M 2 20 Q 2 2 20 2 L 1180 2 Q 1198 2 1198 20 L 1198 44 L 2 44 Z" fill="#11111b" fill-opacity="0.72"/>
  <line x1="2" y1="44" x2="1198" y2="44" stroke="#313244" stroke-width="1"/>
  <circle cx="26" cy="23" r="5.5" fill="#f38ba8"/>
  <circle cx="44" cy="23" r="5.5" fill="#f9e2af"/>
  <circle cx="62" cy="23" r="5.5" fill="#a6e3a1"/>
  <text x="86" y="27" fill="#7f849c" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="0.4">aloneangel45@workstation:~/agent-infra — CGO_ENABLED=0 · zero-mock · deterministic</text>

  <!-- Right Status Pill -->
  <rect x="956" y="11" width="222" height="24" rx="12" fill="#1e1e2e" stroke="#45475a" stroke-width="1"/>
  <circle cx="972" cy="23" r="4" fill="#a6e3a1">
    <animate attributeName="opacity" values="1;0.35;1" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="984" y="27" fill="#a6e3a1" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600">CI MATRIX: 100% PASSING</text>

  <!-- Main Heading -->
  <text x="56" y="114" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.8">Hi, I'm Arda</text>
  <text x="334" y="114" fill="#6c7086" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="24" font-weight="500">@aloneangel45</text>

  <!-- Tagline -->
  <text x="56" y="152" fill="#cdd6f4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="19" font-weight="600">Systems, Reverse Engineering &amp; Deterministic AI Agent Infrastructure</text>
  <text x="56" y="180" fill="#a6adc8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="14.5">Designing zero-dependency binary forensics engines, adaptive MCP proxies, Zstd shadow-tree flight recorders, and offline CI replay harnesses.</text>

  <!-- Right Decorative Telemetry Readout -->
  <g transform="translate(888, 72)">
    <rect x="0" y="0" width="256" height="92" rx="12" fill="#181825" fill-opacity="0.88" stroke="#313244" stroke-width="1"/>
    <text x="16" y="24" fill="#cba6f7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700">$ symforge --stack-telemetry</text>
    <text x="16" y="45" fill="#94e2d5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">arch   : x86_64 · arm64</text>
    <text x="16" y="63" fill="#89b4fa" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">formats: ELF · PE · Mach-O</text>
    <text x="16" y="81" fill="#f9e2af" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5">proto  : MCP · JSON-RPC · SSE</text>
  </g>

  <!-- Divider -->
  <line x1="56" y1="208" x2="1144" y2="208" stroke="#313244" stroke-width="1"/>

  <!-- Bottom Flagship Module Chips -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="600">
    <!-- SymForge -->
    <rect x="56" y="226" width="196" height="34" rx="9" fill="#181825" stroke="#f38ba8" stroke-opacity="0.55" stroke-width="1.2"/>
    <circle cx="74" cy="243" r="4.5" fill="#f38ba8"/>
    <text x="86" y="247" fill="#cdd6f4">SymForge</text>
    <text x="192" y="247" fill="#f38ba8">v1.0.1</text>

    <!-- ToolPrune -->
    <rect x="266" y="226" width="204" height="34" rx="9" fill="#181825" stroke="#89b4fa" stroke-opacity="0.55" stroke-width="1.2"/>
    <circle cx="284" cy="243" r="4.5" fill="#89b4fa"/>
    <text x="296" y="247" fill="#cdd6f4">ToolPrune</text>
    <text x="410" y="247" fill="#89b4fa">v1.3.1</text>

    <!-- TracePort -->
    <rect x="484" y="226" width="204" height="34" rx="9" fill="#181825" stroke="#cba6f7" stroke-opacity="0.55" stroke-width="1.2"/>
    <circle cx="502" cy="243" r="4.5" fill="#cba6f7"/>
    <text x="514" y="247" fill="#cdd6f4">TracePort</text>
    <text x="628" y="247" fill="#cba6f7">v1.2.1</text>

    <!-- AgentFixture -->
    <rect x="702" y="226" width="224" height="34" rx="9" fill="#181825" stroke="#f9e2af" stroke-opacity="0.55" stroke-width="1.2"/>
    <circle cx="720" cy="243" r="4.5" fill="#f9e2af"/>
    <text x="732" y="247" fill="#cdd6f4">AgentFixture</text>
    <text x="866" y="247" fill="#f9e2af">v1.2.1</text>

    <!-- FocusFlow -->
    <rect x="940" y="226" width="204" height="34" rx="9" fill="#181825" stroke="#94e2d5" stroke-opacity="0.55" stroke-width="1.2"/>
    <circle cx="958" cy="243" r="4.5" fill="#94e2d5"/>
    <text x="970" y="247" fill="#cdd6f4">FocusFlow</text>
    <text x="1084" y="247" fill="#94e2d5">v2.2.1</text>
  </g>
</svg>
